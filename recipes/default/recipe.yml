name: 'Web Doc - Default'
description: 'A recipe to manage default installed modules, configs and permissions.'
type: install
install:
  - book
  - node
  - menu_ui
  - manage_display
  - pathauto
  - text
  - display_builder
  - display_builder_entity_view
  - display_builder_ui
config:
  strict: false
  import:
    display_builder:
      - display_builder.profile.default
  actions:
    book.settings:
      simpleConfigUpdate:
        allowed_types:
          -
            content_type: webdoc
            child_type: webdoc
    user.role.content_editor:
      grantPermissions:
        - 'create webdoc content'
        - 'edit own webdoc content'
        - 'delete own webdoc content'
        - 'view webdoc revisions'
        - 'access book list'
        - 'add content to books'
        - 'create new books'
